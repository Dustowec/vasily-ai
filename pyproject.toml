[project]
name = "vasily-ai"
version = "0.1.0"
description = "Vasily - AI agent with modular architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyperclip>=1.8.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "structlog>=24.0.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "pypdf2>=3.0.1",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
